<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Крестики-Нолики | Игра для двоих</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Roboto', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            border-radius: 64px;
            padding: 24px 20px 32px 20px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.1);
        }

        .game-panel {
            background: #1e2f3c;
            border-radius: 48px;
            padding: 24px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .game-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .game-header h1 {
            margin: 0;
            font-size: 2.1rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #FFD166, #F4A261);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .status-area {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 15px;
            background: #0f1a1f;
            padding: 12px 20px;
            border-radius: 60px;
            margin: 15px 0 10px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5), 0 3px 6px rgba(0,0,0,0.2);
        }

        .turn-indicator {
            background: #2c3e2f;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.3rem;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #ecf0f1;
        }

        .turn-symbol {
            font-size: 1.8rem;
            font-weight: 800;
            background: #00000040;
            padding: 0 12px;
            border-radius: 40px;
            min-width: 65px;
            text-align: center;
        }

        .message {
            background: #2d3e42;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            color: #f8f3e2;
            text-align: center;
            flex: 1;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, minmax(85px, 110px));
            gap: 12px;
            justify-content: center;
            margin: 20px 0 25px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            background: #fdf8ed;
            background-image: radial-gradient(circle at 35% 30%, rgba(255,245,215,0.8) 2%, transparent 2.5%);
            background-size: 18px 18px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 800;
            font-family: 'Segoe UI', 'Poppins', system-ui;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 12px 18px -8px rgba(0, 0, 0, 0.4);
            color: #2c3e50;
        }

        .cell:hover:not(.disabled) {
            transform: scale(1.02);
            background: #fff6e8;
        }

        .cell.X { color: #e76f51; text-shadow: 0 0 5px #f4a26180; }
        .cell.O { color: #2a9d8f; text-shadow: 0 0 5px #2a9d8f80; }

        .cell.win-highlight {
            background: #f4d03f;
            color: #1e2f2f;
            box-shadow: 0 0 0 3px #f1c40f, 0 0 0 6px #f39c12;
            transform: scale(1.01);
        }

        .cell.disabled { cursor: default; filter: brightness(0.97); }

        .reset-btn {
            background: #f4a261;
            border: none;
            width: 100%;
            padding: 14px 0;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #2d2b26;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s ease;
            box-shadow: 0 6px 0 #b45f2b;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .reset-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #b45f2b;
        }

        .reset-btn:hover {
            background: #f0b27a;
            letter-spacing: 3px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ffcd7e;
            text-decoration: none;
            font-weight: bold;
            background: #00000055;
            padding: 8px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
        }

        @media (max-width: 480px) {
            .board { grid-template-columns: repeat(3, minmax(75px, 90px)); gap: 10px; }
            .cell { font-size: 3.2rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-panel">
        <div class="game-header">
            <h1>✖️ КРЕСТИКИ-НОЛИКИ 〇</h1>
        </div>
        <div class="status-area">
            <div class="turn-indicator">
                <span class="turn-text">Ход</span>
                <span class="turn-symbol" id="turnSymbol">X</span>
            </div>
            <div class="message" id="statusMessage">Игрок X начинает</div>
        </div>
        <div class="board" id="board"></div>
        <button class="reset-btn" id="resetGameBtn">🔄 Новая игра</button>
        <a href="index.html" class="back-link">🏠 На главный портал</a>
    </div>
</div>

<script>
    (function() {
        let boardState = [['', '', ''], ['', '', ''], ['', '', '']];
        let currentPlayer = 'X';
        let gameActive = true;
        let winCombo = null;

        const boardContainer = document.getElementById('board');
        const turnSymbolSpan = document.getElementById('turnSymbol');
        const statusMessageDiv = document.getElementById('statusMessage');
        const resetBtn = document.getElementById('resetGameBtn');

        const winPatterns = [
            [[0,0],[0,1],[0,2]], [[1,0],[1,1],[1,2]], [[2,0],[2,1],[2,2]],
            [[0,0],[1,0],[2,0]], [[0,1],[1,1],[2,1]], [[0,2],[1,2],[2,2]],
            [[0,0],[1,1],[2,2]], [[0,2],[1,1],[2,0]]
        ];

        function updateUIStatus() {
            if (!gameActive) {
                if (winCombo) turnSymbolSpan.innerText = currentPlayer === 'X' ? '🏆 X' : '🏆 O';
                else turnSymbolSpan.innerText = '—';
                return;
            }
            turnSymbolSpan.innerText = currentPlayer;
            statusMessageDiv.innerText = `Сейчас ходит игрок ${currentPlayer}`;
        }

        function renderBoard() {
            boardContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    const val = boardState[i][j];
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (val === 'X') cell.classList.add('X');
                    if (val === 'O') cell.classList.add('O');
                    if (!gameActive) cell.classList.add('disabled');
                    cell.textContent = val;
                    if (winCombo && winCombo.some(([r,c]) => r === i && c === j))
                        cell.classList.add('win-highlight');
                    cell.addEventListener('click', (function(r,c){ return function(){ handleCellClick(r,c); }; })(i,j));
                    boardContainer.appendChild(cell);
                }
            }
        }

        function checkWin() {
            for (let pattern of winPatterns) {
                const [a,b,c] = pattern;
                const vA = boardState[a[0]][a[1]];
                const vB = boardState[b[0]][b[1]];
                const vC = boardState[c[0]][c[1]];
                if (vA !== '' && vA === vB && vB === vC) {
                    winCombo = pattern;
                    gameActive = false;
                    statusMessageDiv.innerText = `🎉 Игрок ${vA} победил! 🎉`;
                    turnSymbolSpan.innerText = vA === 'X' ? '⭐ X' : '🌟 O';
                    return true;
                }
            }
            return false;
        }

        function checkDraw() {
            for (let i=0;i<3;i++)
                for(let j=0;j<3;j++)
                    if(boardState[i][j]==='') return false;
            gameActive = false;
            statusMessageDiv.innerText = "🤝 Ничья! Игра окончена 🤝";
            turnSymbolSpan.innerText = "⚖️";
            return true;
        }

        function handleCellClick(row, col) {
            if (!gameActive || boardState[row][col] !== '') return;
            boardState[row][col] = currentPlayer;
            renderBoard();
            if (checkWin()) { renderBoard(); return; }
            if (checkDraw()) { renderBoard(); return; }
            currentPlayer = (currentPlayer === 'X') ? 'O' : 'X';
            updateUIStatus();
            renderBoard();
        }

        function resetGame() {
            boardState = [['','',''],['','',''],['','','']];
            currentPlayer = 'X';
            gameActive = true;
            winCombo = null;
            updateUIStatus();
            renderBoard();
        }

        resetBtn.addEventListener('click', resetGame);
        resetGame();
    })();
</script>
</body>
</html>
