<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Вордли | Игровой портал</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color-1: #0f172a;
            --bg-color-2: #1e1b4b;
            --bg-color-3: #312e81;
            --glass-bg: rgba(20, 25, 45, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            
            --primary: #818cf8;
            --accent: #f472b6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --color-correct: #34d399; /* Изумрудный */
            --color-present: #fbbf24; /* Янтарный (желтый) */
            --color-absent: #475569;  /* Серый */
            --color-tile-empty: rgba(255, 255, 255, 0.05);
            --color-tile-filled: rgba(255, 255, 255, 0.15);
        }

        /* ===== Общие сбросы ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            position: relative;
            color: var(--text-main);
            background: linear-gradient(-45deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-3), #170f2a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Декоративные круги на фоне */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.5;
            pointer-events: none;
        }
        body::before {
            width: 400px; height: 400px;
            background: var(--primary);
            top: -100px; left: -100px;
        }
        body::after {
            width: 300px; height: 300px;
            background: var(--accent);
            bottom: -50px; right: -50px;
        }

        /* ===== Главный контейнер ===== */
        .game-card {
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 2rem;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 2rem;
            animation: fadeIn 0.6s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== Кнопка назад ===== */
        .header-actions {
            width: 100%;
            margin-bottom: 1rem;
        }
        .back-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-size: 0.9rem;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .back-button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transform: translateX(-5px);
        }

        /* ===== Шапка ===== */
        .game-header {
            text-align: center;
            margin-bottom: 1rem;
        }
        .game-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, #a78bfa, #f472b6, #fb7185);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.2rem;
        }
        .game-header .sub {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* ===== Сообщения (Уведомления) ===== */
        .message-container {
            min-height: 40px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .message {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            padding: 0.5rem 1.5rem;
            border-radius: 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .message.show {
            opacity: 1;
        }

        /* ===== Сетка Вордли ===== */
        .grid {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 2rem;
        }
        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .tile {
            width: 55px;
            height: 55px;
            background: var(--color-tile-empty);
            border: 2px solid var(--glass-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        .tile.filled {
            border-color: var(--text-muted);
            background: var(--color-tile-filled);
            animation: pop 0.15s ease;
        }

        /* Цвета после проверки */
        .tile.correct {
            background: rgba(52, 211, 153, 0.4);
            border-color: var(--color-correct);
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.3), inset 0 0 10px rgba(0,0,0,0.2);
            color: #fff;
        }
        .tile.present {
            background: rgba(251, 191, 36, 0.4);
            border-color: var(--color-present);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.3), inset 0 0 10px rgba(0,0,0,0.2);
            color: #fff;
        }
        .tile.absent {
            background: rgba(71, 85, 105, 0.6);
            border-color: transparent;
            color: var(--text-muted);
        }

        /* ===== Клавиатура ===== */
        .keyboard {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .key-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        .key {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            color: var(--text-main);
            padding: 12px 10px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            flex: 1;
            max-width: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .key.wide {
            max-width: 75px;
            font-size: 0.8rem;
        }
        .key:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
        .key:active {
            transform: translateY(0);
        }

        /* Цвета на клавиатуре */
        .key.correct { background: var(--color-correct); color: #000; border-color: transparent; }
        .key.present { background: var(--color-present); color: #000; border-color: transparent; }
        .key.absent { background: var(--color-absent); opacity: 0.5; border-color: transparent; }

        /* Кнопка сброса (появляется в конце) */
        .reset-btn {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            border: none;
            color: #fff;
            padding: 0.8rem 2rem;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.5rem;
            display: none;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(225, 29, 72, 0.3);
        }
        .reset-btn:hover {
            background: linear-gradient(135deg, #fb7185, #be123c);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(225, 29, 72, 0.5);
        }

        /* ===== Анимации ===== */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.5s; }

        @keyframes flip {
            0% { transform: rotateX(0); }
            50% { transform: rotateX(90deg); }
            100% { transform: rotateX(0); }
        }
        .flip { animation: flip 0.5s ease forwards; }

        /* ===== Адаптивность ===== */
        @media (max-width: 500px) {
            .game-card { padding: 1.2rem; border-radius: 1.5rem; }
            .tile { width: 45px; height: 45px; font-size: 1.5rem; }
            .key { padding: 12px 6px; font-size: 0.8rem; border-radius: 6px; max-width: 32px;}
            .key.wide { max-width: 60px; font-size: 0.7rem; }
            .grid { gap: 6px; margin-bottom: 1.5rem; }
            .row { gap: 6px; }
            .keyboard { gap: 6px; }
            .key-row { gap: 4px; }
        }
    </style>
</head>
<body>

<div class="game-card">
    <div class="header-actions">
        <!-- Ссылка на главное меню -->
        <a href="index.html" class="back-button">← В меню</a>
    </div>

    <div class="game-header">
        <h1>ВОРДЛИ</h1>
        <div class="sub">Угадай слово из 5 букв за 6 попыток</div>
    </div>

    <div class="message-container">
        <div id="message" class="message"></div>
    </div>

    <div id="grid" class="grid">
        <!-- Сетка 6x5 генерируется через JS -->
    </div>

    <div id="keyboard" class="keyboard">
        <!-- Клавиатура генерируется через JS -->
    </div>

    <button id="reset-btn" class="reset-btn">🔄 Играть снова</button>
</div>

<script>
    // Словарь русских слов (5 букв) - можно расширять
    const wordsList = [
        "АНГЕЛ", "БИЛЕТ", "ВОЛНА", "ГОРОД", "ДВЕРЬ", "ЕРШИК", "ЖИЗНЬ", "ЗАВОД", 
        "ИСКРА", "КАПЛЯ", "ЛАМПА", "МЕЧТА", "НАРОД", "ОКЕАН", "ПЕСНЯ", "РАДИО", 
        "СЛОВО", "ТАКСИ", "УДАЧА", "ФАКЕЛ", "ХЛЕБ", "ЦВЕТА", "ЧАЙКА", "ШКОЛА", 
        "ЩЕТКА", "ЭКРАН", "ЮНОША", "ЯГОДА", "ВЕСНА", "ВЕТЕР", "ГРОЗА", "ЗАМОК", 
        "КАМИН", "КОВЕР", "ЛОДКА", "МОТОР", "НИТКА", "ОГОНЬ", "ПОЕЗД", "РУЧКА", 
        "СОКОЛ", "ТРАВА", "ФИЛЬМ", "ХОЛОД", "ЦЕНТР", "ШЕСТЬ", "ШУТКА", "ЩУКА", 
        "ЭТАЖИ", "ЮЖНЫЙ", "ЯБЛОК", "КНИГА", "ПТИЦА", "ЗЕМЛЯ", "МЕСЯЦ", "ИСКРА"
    ];

    const keyboardLayout = [
        ["Й", "Ц", "У", "К", "Е", "Н", "Г", "Ш", "Щ", "З", "Х", "Ъ"],
        ["Ф", "Ы", "В", "А", "П", "Р", "О", "Л", "Д", "Ж", "Э"],
        ["ВВОД", "Я", "Ч", "С", "М", "И", "Т", "Ь", "Б", "Ю", "УДАЛИТЬ"]
    ];

    let targetWord = "";
    let currentRow = 0;
    let currentCol = 0;
    let gridData = Array(6).fill().map(() => Array(5).fill(""));
    let gameOver = false;
    let isAnimating = false;

    // Инициализация элементов DOM
    const gridElement = document.getElementById("grid");
    const keyboardElement = document.getElementById("keyboard");
    const messageElement = document.getElementById("message");
    const resetBtn = document.getElementById("reset-btn");

    function initGame() {
        // Сброс переменных
        targetWord = wordsList[Math.floor(Math.random() * wordsList.length)];
        currentRow = 0;
        currentCol = 0;
        gridData = Array(6).fill().map(() => Array(5).fill(""));
        gameOver = false;
        isAnimating = false;
        
        // Очистка интерфейса
        gridElement.innerHTML = "";
        keyboardElement.innerHTML = "";
        resetBtn.style.display = "none";
        hideMessage();

        createGrid();
        createKeyboard();
        
        // Для дебага (можно удалить)
        // console.log("Слово: ", targetWord);
    }

    function createGrid() {
        for (let r = 0; r < 6; r++) {
            const rowDiv = document.createElement("div");
            rowDiv.className = "row";
            rowDiv.id = `row-${r}`;
            for (let c = 0; c < 5; c++) {
                const tileDiv = document.createElement("div");
                tileDiv.className = "tile";
                tileDiv.id = `tile-${r}-${c}`;
                rowDiv.appendChild(tileDiv);
            }
            gridElement.appendChild(rowDiv);
        }
    }

    function createKeyboard() {
        keyboardLayout.forEach(row => {
            const rowDiv = document.createElement("div");
            rowDiv.className = "key-row";
            row.forEach(key => {
                const keyBtn = document.createElement("button");
                keyBtn.className = "key";
                keyBtn.textContent = key === "ВВОД" ? "ENT" : key === "УДАЛИТЬ" ? "⌫" : key;
                keyBtn.dataset.key = key;
                if (key === "ВВОД" || key === "УДАЛИТЬ") {
                    keyBtn.classList.add("wide");
                }
                
                keyBtn.addEventListener("click", () => handleKeyPress(key));
                rowDiv.appendChild(keyBtn);
            });
            keyboardElement.appendChild(rowDiv);
        });
    }

    function showMessage(msg, duration = 2000) {
        messageElement.textContent = msg;
        messageElement.classList.add("show");
        if (duration) {
            setTimeout(hideMessage, duration);
        }
    }

    function hideMessage() {
        messageElement.classList.remove("show");
    }

    function handleKeyPress(key) {
        if (gameOver || isAnimating) return;

        if (key === "ВВОД" || key === "ENTER") {
            submitGuess();
        } else if (key === "УДАЛИТЬ" || key === "BACKSPACE") {
            deleteLetter();
        } else if (/^[А-ЯЁа-яё]$/.test(key)) {
            addLetter(key.toUpperCase());
        }
    }

    function addLetter(letter) {
        if (currentCol < 5) {
            // Исправление ё на е
            if(letter === 'Ё') letter = 'Е';
            
            gridData[currentRow][currentCol] = letter;
            const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
            tile.textContent = letter;
            tile.classList.add("filled");
            currentCol++;
        }
    }

    function deleteLetter() {
        if (currentCol > 0) {
            currentCol--;
            gridData[currentRow][currentCol] = "";
            const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
            tile.textContent = "";
            tile.classList.remove("filled");
        }
    }

    function submitGuess() {
        if (currentCol !== 5) {
            showMessage("Недостаточно букв");
            shakeRow(currentRow);
            return;
        }

        const guess = gridData[currentRow].join("");
        checkGuess(guess);
    }

    function shakeRow(rowIndex) {
        const row = document.getElementById(`row-${rowIndex}`);
        row.classList.remove("shake");
        void row.offsetWidth; // trigger reflow
        row.classList.add("shake");
        setTimeout(() => row.classList.remove("shake"), 500);
    }

    function checkGuess(guess) {
        isAnimating = true;
        const row = document.getElementById(`row-${currentRow}`);
        const tiles = row.childNodes;
        
        let targetLetters = targetWord.split("");
        let guessLetters = guess.split("");
        let results = Array(5).fill("absent");

        // 1. Ищем точные совпадения (Зеленые)
        for (let i = 0; i < 5; i++) {
            if (guessLetters[i] === targetLetters[i]) {
                results[i] = "correct";
                targetLetters[i] = null; // Помечаем как использованную
            }
        }

        // 2. Ищем присутствующие буквы (Желтые)
        for (let i = 0; i < 5; i++) {
            if (results[i] === "correct") continue;

            const letterIndex = targetLetters.indexOf(guessLetters[i]);
            if (letterIndex !== -1) {
                results[i] = "present";
                targetLetters[letterIndex] = null;
            }
        }

        // 3. Анимация переворота и покраска
        tiles.forEach((tile, i) => {
            setTimeout(() => {
                tile.classList.add("flip");
                
                // Меняем цвет на середине анимации переворота
                setTimeout(() => {
                    tile.classList.add(results[i]);
                    updateKeyboardKey(guessLetters[i], results[i]);
                }, 250);

                // Конец анимации последней плитки
                if (i === 4) {
                    setTimeout(() => {
                        isAnimating = false;
                        checkGameState(guess);
                    }, 500);
                }
            }, i * 200); // Задержка для эффекта волны
        });
    }

    function updateKeyboardKey(letter, status) {
        const keyBtn = document.querySelector(`.key[data-key="${letter}"]`);
        if (!keyBtn) return;

        // Не перезаписываем зеленый статус желтым или серым
        if (keyBtn.classList.contains("correct")) return;
        if (keyBtn.classList.contains("present") && status === "absent") return;

        keyBtn.classList.remove("present", "absent", "correct");
        keyBtn.classList.add(status);
    }

    function checkGameState(guess) {
        if (guess === targetWord) {
            showMessage("🎉 Победа! Вы угадали слово!", 0);
            gameOver = true;
            showResetBtn();
            return;
        }

        currentRow++;
        currentCol = 0;

        if (currentRow === 6) {
            showMessage(`Увы! Загаданное слово: ${targetWord}`, 0);
            gameOver = true;
            showResetBtn();
        }
    }

    function showResetBtn() {
        setTimeout(() => {
            resetBtn.style.display = "block";
            // Анимация появления
            resetBtn.animate([
                { opacity: 0, transform: 'translateY(10px)' },
                { opacity: 1, transform: 'translateY(0)' }
            ], { duration: 300, fill: 'forwards' });
        }, 800);
    }

    // Слушатель физической клавиатуры
    document.addEventListener("keydown", (e) => {
        if (gameOver) return;
        
        let key = e.key;
        if (key === "Enter") handleKeyPress("ВВОД");
        else if (key === "Backspace") handleKeyPress("УДАЛИТЬ");
        else {
            handleKeyPress(key);
        }
    });

    // Клик по кнопке рестарта
    resetBtn.addEventListener("click", initGame);

    // Старт игры
    initGame();
</script>
</body>
</html>
