<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Камень, ножницы, бумага | Игровой портал</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color-1: #0f172a;
            --bg-color-2: #1e1b4b;
            --bg-color-3: #312e81;
            --glass-bg: rgba(20, 25, 45, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --primary: #818cf8;
            --accent: #f472b6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --win-color: #34d399; /* Изумрудный для победы */
            --lose-color: #fb7185; /* Розовый для поражения */
        }

        /* ===== Общие сбросы ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
            color: var(--text-main);
            /* Анимированный градиентный фон */
            background: linear-gradient(-45deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-3), #170f2a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Декоративные круги на фоне */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.5;
            pointer-events: none;
        }
        body::before {
            width: 400px; height: 400px;
            background: var(--primary);
            top: -100px; left: -100px;
        }
        body::after {
            width: 300px; height: 300px;
            background: var(--accent);
            bottom: -50px; right: -50px;
        }

        /* ===== Главный контейнер ===== */
        .game-card {
            width: 100%;
            max-width: 800px;
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 2rem;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 2.5rem;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== Кнопка назад ===== */
        .header-actions {
            margin-bottom: 1rem;
        }
        .back-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-size: 0.9rem;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .back-button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transform: translateX(-5px);
        }

        /* ===== Шапка ===== */
        .game-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .game-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(to right, #a78bfa, #f472b6, #fb7185);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .game-header .sub {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 500;
        }

        /* ===== Секция счета ===== */
        .scoreboard {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .score-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            border-radius: 1.5rem;
            text-align: center;
            min-width: 140px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .score-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        .score-value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }
        #computer-score {
            color: var(--accent);
        }
        .versus-badge {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #fff;
            box-shadow: 0 0 15px rgba(244, 114, 182, 0.4);
        }

        /* ===== Зона выбора ===== */
        .game-arena {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .choice-panel {
            text-align: center;
            flex: 1;
            min-width: 150px;
        }
        .choice-label {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            display: inline-block;
        }
        .choice-icon {
            font-size: 5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 2rem;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        .choice-icon span {
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        /* ===== Зона результатов ===== */
        .result-area {
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .round-result {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            font-size: 1.1rem;
            font-weight: 500;
            text-align: center;
            transition: all 0.3s ease;
        }
        /* Динамические классы для результатов */
        .round-result.win {
            border-color: var(--win-color);
            background: rgba(52, 211, 153, 0.1);
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.2);
            color: var(--win-color);
        }
        .round-result.lose {
            border-color: var(--lose-color);
            background: rgba(251, 113, 133, 0.1);
            box-shadow: 0 0 15px rgba(251, 113, 133, 0.2);
            color: var(--lose-color);
        }
        .round-result.draw {
            border-color: var(--text-muted);
            color: var(--text-main);
        }

        /* ===== Кнопки действий ===== */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .game-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-family: inherit;
            padding: 1rem 1.5rem;
            border-radius: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 120px;
        }
        .game-btn span:first-child { font-size: 2rem; }
        .game-btn span:last-child { font-size: 0.9rem; font-weight: 600; letter-spacing: 1px; }
        
        .game-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3), 0 0 15px rgba(129, 140, 248, 0.3);
        }
        .game-btn:active { transform: translateY(0); }

        .reset-btn {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            border: none;
            justify-content: center;
        }
        .reset-btn:hover {
            background: linear-gradient(135deg, #fb7185, #be123c);
            border-color: transparent;
            box-shadow: 0 10px 20px rgba(225, 29, 72, 0.4);
        }

        /* Анимация пульсации */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: inset 0 0 20px rgba(0,0,0,0.2); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,255,255,0.2), inset 0 0 20px rgba(0,0,0,0.2); }
            100% { transform: scale(1); box-shadow: inset 0 0 20px rgba(0,0,0,0.2); }
        }
        .choice-icon.pulse {
            animation: pulse 0.3s ease-in-out 2;
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            color: rgba(148, 163, 184, 0.6);
            border-top: 1px solid var(--glass-border);
        }

        /* ===== Адаптивность ===== */
        @media (max-width: 600px) {
            .game-card { padding: 1.5rem; }
            .game-header h1 { font-size: 2rem; }
            .game-arena { gap: 1rem; }
            .choice-icon { width: 100px; height: 100px; font-size: 3.5rem; border-radius: 1.5rem; }
            .score-card { min-width: 110px; padding: 0.8rem 1rem; }
            .score-value { font-size: 2.5rem; }
            .game-btn { min-width: 100px; padding: 0.8rem; }
            .game-btn span:first-child { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div class="game-card">
    <div class="header-actions">
        <!-- Ссылка на главное меню (название файла укажите ваше) -->
        <a href="index.html" class="back-button">← В меню</a>
    </div>

    <div class="game-header">
        <h1><span>✊</span> Камень ✂️ Бумага <span>✋</span></h1>
        <div class="sub">Игра против компьютера | Кто первый до 5 побед?</div>
    </div>

    <div class="scoreboard">
        <div class="score-card" id="player-card">
            <div class="score-label">Игрок</div>
            <div class="score-value" id="player-score">0</div>
        </div>
        <div class="versus-badge">VS</div>
        <div class="score-card" id="computer-card">
            <div class="score-label">ИИ</div>
            <div class="score-value" id="computer-score">0</div>
        </div>
    </div>

    <div class="game-arena">
        <div class="choice-panel">
            <div class="choice-label">Твой выбор</div>
            <div class="choice-icon" id="player-choice-icon">
                <span>❓</span>
            </div>
        </div>
        <div class="choice-panel">
            <div class="choice-label">Выбор ИИ</div>
            <div class="choice-icon" id="computer-choice-icon">
                <span>❓</span>
            </div>
        </div>
    </div>

    <div class="result-area" id="result-message">
        <div class="round-result">⚡ Нажми на кнопку, чтобы начать!</div>
    </div>

    <div class="action-buttons">
        <button class="game-btn" data-move="rock">
            <span>✊</span><span>Камень</span>
        </button>
        <button class="game-btn" data-move="scissors">
            <span>✌️</span><span>Ножницы</span>
        </button>
        <button class="game-btn" data-move="paper">
            <span>✋</span><span>Бумага</span>
        </button>
        <button class="game-btn reset-btn" id="reset-game">
            <span>🔄</span><span>Сброс</span>
        </button>
    </div>

    <footer>Правила: Камень ломает ножницы, Ножницы режут бумагу, Бумага кроет камень.</footer>
</div>

<script>
    // Эмодзи и текстовые представления
    const movesMap = {
        rock: { name: "Камень", emoji: "✊", beats: "scissors" },
        scissors: { name: "Ножницы", emoji: "✌️", beats: "paper" },
        paper: { name: "Бумага", emoji: "✋", beats: "rock" }
    };

    const moveOrder = ["rock", "scissors", "paper"];

    // DOM элементы
    const playerScoreSpan = document.getElementById("player-score");
    const computerScoreSpan = document.getElementById("computer-score");
    const playerChoiceIconDiv = document.getElementById("player-choice-icon");
    const computerChoiceIconDiv = document.getElementById("computer-choice-icon");
    const resultMessageDiv = document.getElementById("result-message");

    let playerScore = 0;
    let computerScore = 0;
    let isProcessing = false; // защита от спама во время анимации

    // Обновление интерфейса счета
    function updateScoreUI() {
        playerScoreSpan.innerText = playerScore;
        computerScoreSpan.innerText = computerScore;
    }

    // Случайный ход компьютера
    function getComputerMove() {
        const randomIndex = Math.floor(Math.random() * moveOrder.length);
        return moveOrder[randomIndex];
    }

    // Определение победителя
    function determineWinner(playerMove, computerMove) {
        if (playerMove === computerMove) return 'draw';
        if (movesMap[playerMove].beats === computerMove) return 'player';
        return 'computer';
    }

    // Анимация пульсации
    function animateChoice(element) {
        if (!element) return;
        element.classList.remove('pulse');
        void element.offsetWidth; // Триггер рефлоу для перезапуска анимации
        element.classList.add('pulse');
    }

    // Основная логика раунда
    async function playRound(playerMove) {
        if (isProcessing) {
            updateResultDisplay("⏳ Подожди, идет ход...", "draw");
            setTimeout(() => {
                if (resultMessageDiv.innerText.includes("Подожди")) updateResultDisplay("🎲 Сделай ход!", "");
            }, 800);
            return;
        }

        isProcessing = true;
        const computerMove = getComputerMove();

        // Эффект "обдумывания"
        computerChoiceIconDiv.innerHTML = `<span>🤔</span>`;
        playerChoiceIconDiv.innerHTML = `<span>${movesMap[playerMove].emoji}</span>`;
        animateChoice(playerChoiceIconDiv);

        // Задержка для реализма
        await new Promise(resolve => setTimeout(resolve, 300));

        computerChoiceIconDiv.innerHTML = `<span>${movesMap[computerMove].emoji}</span>`;
        animateChoice(computerChoiceIconDiv);

        const winner = determineWinner(playerMove, computerMove);
        let resultText = "";

        if (winner === 'player') {
            playerScore++;
            resultText = `🥳 Вы победили! ${movesMap[playerMove].name} ${getVerb(playerMove, computerMove)} ${movesMap[computerMove].name.toLowerCase()}.`;
        } else if (winner === 'computer') {
            computerScore++;
            resultText = `😵 ИИ победил! ${movesMap[computerMove].name} ${getVerb(computerMove, playerMove)} ${movesMap[playerMove].name.toLowerCase()}.`;
        } else {
            resultText = `🤝 Ничья! Оба выбрали ${movesMap[playerMove].name.toLowerCase()}.`;
        }

        updateScoreUI();
        updateResultDisplay(resultText, winner);

        // Проверка на окончание матча (до 5 побед)
        if (playerScore >= 5 || computerScore >= 5) {
            let gameWinner = playerScore >= 5 ? "ИГРОК" : "ИИ";
            let celebrationMsg = playerScore >= 5 ? "🏆 ВЫ ВЫИГРАЛИ МАТЧ!" : "💀 КОМПЬЮТЕР ВЫИГРАЛ МАТЧ!";
            updateResultDisplay(`${celebrationMsg} Финал ${playerScore}:${computerScore}. Жми «Сброс»`, winner);
            disableGameButtons(true);
            return;
        }

        isProcessing = false;
    }

    // Вспомогательный глагол
    function getVerb(winnerMove, loserMove) {
        if (winnerMove === 'rock' && loserMove === 'scissors') return "ломает";
        if (winnerMove === 'scissors' && loserMove === 'paper') return "режут";
        if (winnerMove === 'paper' && loserMove === 'rock') return "кроет";
        return "побеждает";
    }

    // Обновить панель результата с добавлением классов состояний (win/lose/draw)
    function updateResultDisplay(message, winnerType = "") {
        let stateClass = "";
        if (winnerType === 'player') stateClass = "win";
        else if (winnerType === 'computer') stateClass = "lose";
        else if (winnerType === 'draw') stateClass = "draw";

        resultMessageDiv.innerHTML = `<div class="round-result ${stateClass}">${message}</div>`;
    }

    // Отключение кнопок при конце матча
    function disableGameButtons(disabled) {
        const btns = document.querySelectorAll('.game-btn[data-move]');
        btns.forEach(btn => {
            if (disabled) {
                btn.style.opacity = "0.5";
                btn.style.pointerEvents = "none";
                btn.style.filter = "grayscale(100%)";
            } else {
                btn.style.opacity = "1";
                btn.style.pointerEvents = "auto";
                btn.style.filter = "none";
            }
        });
    }

    // Сброс
    function resetGame() {
        playerScore = 0;
        computerScore = 0;
        updateScoreUI();

        playerChoiceIconDiv.innerHTML = `<span>❓</span>`;
        computerChoiceIconDiv.innerHTML = `<span>❓</span>`;
        updateResultDisplay("✨ Счёт сброшен! Сделай ход ✨", "");
        
        disableGameButtons(false);
        isProcessing = false;
    }

    // Привязка событий
    function bindEvents() {
        document.querySelector('[data-move="rock"]').addEventListener("click", () => playRound("rock"));
        document.querySelector('[data-move="scissors"]').addEventListener("click", () => playRound("scissors"));
        document.querySelector('[data-move="paper"]').addEventListener("click", () => playRound("paper"));
        document.getElementById("reset-game").addEventListener("click", resetGame);
    }

    // Инициализация
    window.addEventListener("DOMContentLoaded", () => {
        bindEvents();
        resetGame();
    });
</script>
</body>
</html>
