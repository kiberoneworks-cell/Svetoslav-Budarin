<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🎮 Вордли | Wordle-style игра</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #121212 0%, #1a1e2c 100%);
            font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, -apple-system, 'Roboto', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* главный контейнер */
        .game-wrapper {
            max-width: 620px;
            width: 100%;
            background: rgba(18, 18, 18, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 20px 16px 30px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: all 0.2s;
        }

        h1 {
            text-align: center;
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: 3px;
            margin: 0 0 8px 0;
            color: #f9f6e5;
            text-shadow: 0 2px 5px #00000030;
            word-break: keep-all;
        }
        .sub {
            text-align: center;
            color: #9aa4bf;
            font-size: 0.75rem;
            margin-top: -8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* сетка 6x5 */
        .board {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .tile {
            width: 65px;
            height: 65px;
            background: #1e1f24;
            border: 2px solid #3a3c42;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            color: #f2f2f2;
            transition: all 0.12s linear;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-family: 'Courier New', 'Fira Mono', monospace;
        }

        /* анимация нажатия */
        .tile.pop {
            transform: scale(0.92);
        }

        /* цветовые состояния */
        .tile.correct {
            background: #538d4e;
            border-color: #538d4e;
            animation: softFlip 0.3s ease;
        }
        .tile.present {
            background: #b59f3b;
            border-color: #b59f3b;
            animation: softFlip 0.3s ease;
        }
        .tile.absent {
            background: #3a3a3c;
            border-color: #3a3a3c;
            color: #c0c0c0;
        }

        @keyframes softFlip {
            0% { transform: scale(0.9); opacity: 0.6; }
            80% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* клавиатура */
        .keyboard {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }
        .kb-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .key {
            background: #2f3138;
            border: none;
            border-radius: 12px;
            padding: 12px 12px;
            min-width: 44px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #f9f9f9;
            cursor: pointer;
            transition: all 0.1s;
            text-transform: uppercase;
            box-shadow: 0 2px 3px rgba(0,0,0,0.3);
            font-family: monospace;
        }
        .key:active {
            transform: scale(0.96);
            background: #3f4250;
        }
        .key.special {
            background: #4c505c;
            font-size: 0.9rem;
            min-width: 68px;
        }
        /* стили клавиш после цветовой индикации */
        .key.correct {
            background: #538d4e;
            color: white;
        }
        .key.present {
            background: #b59f3b;
            color: white;
        }
        .key.absent {
            background: #3a3a3c;
            color: #aaa;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 12px;
            padding: 0 8px;
        }
        .message {
            background: #1b1e2a;
            padding: 10px 16px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #d6e6ff;
            flex: 1;
            text-align: center;
            letter-spacing: 0.3px;
        }
        .new-game {
            background: #4b6e8a;
            border: none;
            border-radius: 40px;
            padding: 10px 22px;
            font-weight: bold;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 2px 4px black;
        }
        .new-game:active {
            transform: scale(0.96);
            background: #2d4f6e;
        }

        @media (max-width: 550px) {
            .tile {
                width: 52px;
                height: 52px;
                font-size: 1.7rem;
                border-radius: 12px;
            }
            .key {
                min-width: 35px;
                padding: 8px 6px;
                font-size: 1rem;
            }
            .key.special {
                min-width: 55px;
            }
            .kb-row {
                gap: 5px;
            }
            .row {
                gap: 8px;
            }
            h1 {
                font-size: 1.7rem;
            }
        }

        @media (max-width: 450px) {
            .tile {
                width: 44px;
                height: 44px;
                font-size: 1.4rem;
            }
            .key {
                min-width: 30px;
                padding: 6px 5px;
                font-size: 0.85rem;
            }
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #525b73;
            margin-top: 20px;
        }
        button {
            font-family: inherit;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <h1>🎯 ВОРДЛИ</h1>
    <div class="sub">угадай слово за 6 попыток</div>

    <!-- игровая сетка 6x5 -->
    <div class="board" id="gameBoard"></div>

    <!-- экранная клавиатура -->
    <div class="keyboard" id="keyboardContainer"></div>

    <div class="info-panel">
        <div class="message" id="statusMessage">⭐ Введи 5-буквенное слово</div>
        <button class="new-game" id="resetGameBtn">🔄 Новая игра</button>
    </div>
    <footer>⌨️ клавиатура ПК / экранные кнопки • каждая попытка даёт подсказку</footer>
</div>

<script>
    // -------------------- СЛОВАРЬ (5-буквенные слова) --------------------
    const VALID_WORDS = [
        "APPLE", "HOUSE", "MONEY", "WORLD", "HEART", "MIGHT", "PLANE", "OCEAN",
        "BRING", "PAINT", "CLOUD", "SMILE", "DREAM", "FRUIT", "GREEN", "LIGHT",
        "NIGHT", "MUSIC", "PEACE", "HAPPY", "STONE", "WATER", "EARTH", "FIRE",
        "BREAD", "TABLE", "CHAIR", "HORSE", "MOUSE", "PLANT", "SOUND", "PRICE",
        "MATCH", "FRAME", "BIRTH", "GHOST", "CRANE", "SLATE", "REACT", "HONEY",
        "FLAME", "SPACE", "TRUST", "FRESH", "BLACK", "WHITE", "BROWN", "MAGIC"
    ];
    
    // -------------------- ГЛОБАЛЬНОЕ СОСТОЯНИЕ --------------------
    let targetWord = "";          // загаданное слово (uppercase)
    let currentGuess = "";        // текущий ввод (строка до 5 букв)
    let currentRow = 0;           // какая строка заполняется сейчас (0..5)
    let gameWon = false;
    let gameLost = false;
    
    // массив для хранения результатов каждой строки: [ { guess: string, statuses: [] } , ... ]
    let evaluatedRows = [];       
    
    // DOM элементы
    let boardContainer;
    let messageDiv;
    let keyboardContainer;
    
    // вспомогательные переменные для динамической отрисовки
    let tileElements = [];   // 2D массив [row][col] => HTMLElement
    
    // -------------------- ИНИЦИАЛИЗАЦИЯ / ОТРИСОВКА СЕТКИ --------------------
    function buildGrid() {
        boardContainer.innerHTML = "";
        tileElements = [];
        for (let r = 0; r < 6; r++) {
            const rowDiv = document.createElement("div");
            rowDiv.classList.add("row");
            const rowTiles = [];
            for (let c = 0; c < 5; c++) {
                const tile = document.createElement("div");
                tile.classList.add("tile");
                tile.textContent = "";
                rowDiv.appendChild(tile);
                rowTiles.push(tile);
            }
            boardContainer.appendChild(rowDiv);
            tileElements.push(rowTiles);
        }
    }
    
    // обновить визуальный ряд текущей строки (отобразить currentGuess)
    function updateCurrentRowDisplay() {
        if (currentRow >= 6) return;
        const rowTiles = tileElements[currentRow];
        for (let i = 0; i < 5; i++) {
            const letter = currentGuess[i] || "";
            rowTiles[i].textContent = letter;
            // не сбрасываем цвета если строка еще не оценена (классы остаются старыми, но новые буквы)
            // если строка уже была оценена - мы её не трогаем, но currentRow изменится.
            // Однако во время ввода строка всегда "чистая" либо не имела классов оценки
            // дополнительно подчистим классы, если они не должны висеть (для случая когда игра сброшена или начало)
            if (!evaluatedRows[currentRow]) {
                // убираем старые цветные классы, если вдруг они были (например при ресете)
                rowTiles[i].classList.remove("correct", "present", "absent");
            }
        }
    }
    
    // применить результаты оценки строки (раскрасить плитки)
    function applyRowEvaluation(rowIndex, guess, statuses) {
        const rowTiles = tileElements[rowIndex];
        for (let i = 0; i < 5; i++) {
            rowTiles[i].textContent = guess[i];
            rowTiles[i].classList.remove("correct", "present", "absent");
            if (statuses[i] === "correct") {
                rowTiles[i].classList.add("correct");
            } else if (statuses[i] === "present") {
                rowTiles[i].classList.add("present");
            } else {
                rowTiles[i].classList.add("absent");
            }
        }
    }
    
    // пересчитать цвета клавиатуры на основе всех оценённых строк
    function updateKeyboardColors() {
        // собираем для каждой буквы наилучший статус (correct > present > absent)
        const letterBest = {};
        for (let i = 0; i < evaluatedRows.length; i++) {
            const row = evaluatedRows[i];
            if (!row) continue;
            const guess = row.guess;
            const statuses = row.statuses;
            for (let idx = 0; idx < 5; idx++) {
                const letter = guess[idx];
                const st = statuses[idx];
                let priority = 0;
                if (st === "correct") priority = 3;
                else if (st === "present") priority = 2;
                else if (st === "absent") priority = 1;
                else continue;
                
                const currentPriority = letterBest[letter] ? (letterBest[letter].prio || 0) : 0;
                if (priority > currentPriority) {
                    letterBest[letter] = { status: st, prio: priority };
                } else if (priority === currentPriority && letterBest[letter]) {
                    // оставляем тот же
                }
            }
        }
        // обновляем все клавиши
        const allKeys = document.querySelectorAll(".key:not(.special)");
        allKeys.forEach(key => {
            const letter = key.getAttribute("data-letter");
            if (!letter) return;
            const best = letterBest[letter];
            key.classList.remove("correct", "present", "absent");
            if (best) {
                key.classList.add(best.status);
            }
        });
    }
    
    // -------------------- ОСНОВНАЯ ЛОГИКА ОЦЕНКИ СЛОВА (Wordle classic)--------------------
    function evaluateGuess(guess, target) {
        // guess и target уже UPPERCASE, длины 5
        const result = new Array(5).fill("absent");
        const targetArr = target.split('');
        const guessArr = guess.split('');
        
        // Шаг 1: отметить точные совпадения (correct)
        for (let i = 0; i < 5; i++) {
            if (guessArr[i] === targetArr[i]) {
                result[i] = "correct";
                targetArr[i] = null;   // помечаем как использованную
                guessArr[i] = null;
            }
        }
        // Шаг 2: отметить присутствующие но не на своих местах (present)
        for (let i = 0; i < 5; i++) {
            if (guessArr[i] === null) continue;
            const foundIndex = targetArr.indexOf(guessArr[i]);
            if (foundIndex !== -1) {
                result[i] = "present";
                targetArr[foundIndex] = null;
            }
        }
        return result;
    }
    
    // проверка победы: все статусы "correct"
    function isWin(statuses) {
        return statuses.every(st => st === "correct");
    }
    
    // обработка сабмита (отправка текущего слова)
    function submitGuess() {
        if (gameWon || gameLost) {
            setMessage(`🎲 Игра завершена! Нажми "Новая игра".`);
            return;
        }
        if (currentGuess.length !== 5) {
            setMessage(`❗ Не хватает букв (нужно 5)`);
            return;
        }
        const guessUpper = currentGuess.toUpperCase();
        if (!VALID_WORDS.includes(guessUpper)) {
            setMessage(`❌ "${guessUpper}" нет в списке слов!`);
            return;
        }
        
        // проверяем, не была ли уже заполнена эта строка (защита)
        if (evaluatedRows[currentRow]) {
            setMessage(`🚫 Эта строка уже использована`);
            return;
        }
        
        // оцениваем
        const statuses = evaluateGuess(guessUpper, targetWord);
        const isGameWon = isWin(statuses);
        
        // сохраняем результат строки
        evaluatedRows[currentRow] = { guess: guessUpper, statuses: statuses };
        applyRowEvaluation(currentRow, guessUpper, statuses);
        
        // обновляем клавиатуру на основе всех оценок
        updateKeyboardColors();
        
        // проверка победы
        if (isGameWon) {
            gameWon = true;
            setMessage(`🎉 ПОБЕДА! Слово — ${targetWord}. Поздравляю! 🎉`);
            return;
        }
        
        // переход на следующую строку
        currentRow++;
        currentGuess = "";
        
        // проверка поражения (после увеличения currentRow, если currentRow === 6 -> 6 попыток исчерпано)
        if (currentRow === 6) {
            gameLost = true;
            setMessage(`😔 Проигрыш! Загаданное слово: ${targetWord}. Попробуй ещё.`);
            // обновить отображение последней строки (все равно чисто)
        } else {
            // обновляем отображение новой строки (очищаем)
            updateCurrentRowDisplay();
            setMessage(`📝 Попытка ${currentRow+1}/6. Введи слово.`);
        }
        
        // если игра окончена, клавиатура всё ещё видна, но ввод блокируется через gameWon/gameLost флаги
        if (gameLost || gameWon) return;
    }
    
    // добавление буквы
    function addLetter(letter) {
        if (gameWon || gameLost) return;
        if (currentGuess.length < 5) {
            currentGuess += letter.toUpperCase();
            updateCurrentRowDisplay();
        }
        if (currentGuess.length === 5) {
            setMessage("✅ Нажми ⏎, чтобы проверить");
        } else {
            setMessage(`📝 Введи слово (${currentGuess.length}/5)`);
        }
    }
    
    function deleteLetter() {
        if (gameWon || gameLost) return;
        if (currentGuess.length > 0) {
            currentGuess = currentGuess.slice(0, -1);
            updateCurrentRowDisplay();
            setMessage(`✏️ ${currentGuess.length}/5 букв`);
        }
    }
    
    function setMessage(msg) {
        if (messageDiv) messageDiv.textContent = msg;
    }
    
    // -------------------- СБРОС ИГРЫ (новая игра) --------------------
    function resetGame() {
        // выбираем новое случайное слово из словаря
        const randomIndex = Math.floor(Math.random() * VALID_WORDS.length);
        targetWord = VALID_WORDS[randomIndex];
        console.log(`[DEV] новое слово: ${targetWord}`); // для отладки, но в продакшене не мешает
        
        currentGuess = "";
        currentRow = 0;
        gameWon = false;
        gameLost = false;
        evaluatedRows = [];
        
        // перестраиваем визуально сетку (чистые плитки)
        for (let r = 0; r < 6; r++) {
            for (let c = 0; c < 5; c++) {
                tileElements[r][c].textContent = "";
                tileElements[r][c].classList.remove("correct", "present", "absent");
            }
        }
        // сброс клавиатурных цветов
        const allKeys = document.querySelectorAll(".key");
        allKeys.forEach(key => {
            key.classList.remove("correct", "present", "absent");
        });
        
        setMessage(`🎯 Новая игра! Слово из 5 букв. Попытка 1/6`);
    }
    
    // -------------------- ПОСТРОЕНИЕ КЛАВИАТУРЫ --------------------
    function buildKeyboard() {
        keyboardContainer.innerHTML = "";
        const rowsLayout = [
            ["Й", "Ц", "У", "К", "Е", "Н", "Г", "Ш", "Щ", "З", "Х", "Ъ"],
            ["Ф", "Ы", "В", "А", "П", "Р", "О", "Л", "Д", "Ж", "Э"],
            ["Я", "Ч", "С", "М", "И", "Т", "Ь", "Б", "Ю", "←", "ENTER"]
        ];
        
        // но в российском вордли удобно использовать английскую раскладку? Обычно вордли на русском, но словарь у нас английский.
        // Чтобы игра была интуитивной, лучше дать английские буквы QWERTY, так как словарь на английском.
        // Поменяем на английскую клавиатуру (стандарт Wordle) чтобы легче вводить.
        // Но пользователю удобнее? русские буквы не подойдут (словарь английский). Сделаем английскую QWERTY.
        const engLayout = [
            ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
            ["A", "S", "D", "F", "G", "H", "J", "K", "L"],
            ["ENTER", "Z", "X", "C", "V", "B", "N", "M", "⌫"]
        ];
        
        for (let i = 0; i < engLayout.length; i++) {
            const rowDiv = document.createElement("div");
            rowDiv.classList.add("kb-row");
            for (let btn of engLayout[i]) {
                const button = document.createElement("button");
                let displayText = btn;
                let isSpecial = (btn === "ENTER" || btn === "⌫");
                button.classList.add("key");
                if (isSpecial) button.classList.add("special");
                
                if (btn === "ENTER") {
                    button.textContent = "⏎";
                    button.setAttribute("data-action", "enter");
                    button.addEventListener("click", () => submitGuess());
                } 
                else if (btn === "⌫") {
                    button.textContent = "⌫";
                    button.setAttribute("data-action", "backspace");
                    button.addEventListener("click", () => deleteLetter());
                }
                else {
                    button.textContent = btn;
                    button.setAttribute("data-letter", btn);
                    button.addEventListener("click", () => addLetter(btn));
                }
                rowDiv.appendChild(button);
            }
            keyboardContainer.appendChild(rowDiv);
        }
    }
    
    // -------------------- ФИЗИЧЕСКАЯ КЛАВИАТУРА --------------------
    function handlePhysicalKeyboard(e) {
        if (gameWon || gameLost) {
            // разрешаем только клавишу новой игры? но и так будут игнор
            if (e.key === "Enter") {
                e.preventDefault();
                setMessage(`Игра завершена, нажмите "Новая игра"`);
            }
            return;
        }
        const key = e.key;
        if (key === "Enter") {
            e.preventDefault();
            submitGuess();
        } 
        else if (key === "Backspace") {
            e.preventDefault();
            deleteLetter();
        }
        else {
            // буква a-z или A-Z
            const letterMatch = key.match(/^[a-zA-Z]$/);
            if (letterMatch) {
                e.preventDefault();
                let letter = key.toUpperCase();
                // допустимые буквы английского алфавита
                if (/[A-Z]/.test(letter) && letter.length === 1) {
                    addLetter(letter);
                }
            }
        }
    }
    
    // -------------------- ИНИЦИАЛИЗАЦИЯ --------------------
    function initGame() {
        boardContainer = document.getElementById("gameBoard");
        messageDiv = document.getElementById("statusMessage");
        keyboardContainer = document.getElementById("keyboardContainer");
        
        buildGrid();
        buildKeyboard();
        
        // выбор случайного слова
        const randomIndex = Math.floor(Math.random() * VALID_WORDS.length);
        targetWord = VALID_WORDS[randomIndex];
        console.log(`🎯 target word: ${targetWord}`);   // Подсказка для отладки (можно скрыть, но в консоли видно)
        
        currentGuess = "";
        currentRow = 0;
        gameWon = false;
        gameLost = false;
        evaluatedRows = [];
        
        // очистка плиток и классов
        for (let r = 0; r < 6; r++) {
            for (let c = 0; c < 5; c++) {
                tileElements[r][c].textContent = "";
                tileElements[r][c].classList.remove("correct", "present", "absent");
            }
        }
        setMessage(`🎯 Попробуй угадать! Попытка 1/6`);
        
        // Сброс клавиатурных цветов
        const allKeys = document.querySelectorAll(".key");
        allKeys.forEach(k => k.classList.remove("correct", "present", "absent"));
        
        // событие клавиатуры
        window.removeEventListener("keydown", handlePhysicalKeyboard);
        window.addEventListener("keydown", handlePhysicalKeyboard);
        
        // кнопка новой игры
        const resetBtn = document.getElementById("resetGameBtn");
        if (resetBtn) {
            resetBtn.removeEventListener("click", resetGame);
            resetBtn.addEventListener("click", () => {
                resetGame();
            });
        }
    }
    
    // дополнительно, если resetGame переопределен глобально, нужно чтобы он корректно сбрасывал все массивы и UI.
    // переопределим resetGame с полной перезагрузкой игровой логики и отрисовкой.
    window.resetGame = function() {
        const randomIdx = Math.floor(Math.random() * VALID_WORDS.length);
        targetWord = VALID_WORDS[randomIdx];
        currentGuess = "";
        currentRow = 0;
        gameWon = false;
        gameLost = false;
        evaluatedRows = [];
        
        for (let r = 0; r < 6; r++) {
            for (let c = 0; c < 5; c++) {
                tileElements[r][c].textContent = "";
                tileElements[r][c].classList.remove("correct", "present", "absent");
            }
        }
        const allKeys = document.querySelectorAll(".key");
        allKeys.forEach(k => k.classList.remove("correct", "present", "absent"));
        setMessage(`✨ Новая игра! Слово из 5 букв. Попытка 1/6`);
    };
    
    // финальный запуск
    initGame();
</script>
</body>
</html>
