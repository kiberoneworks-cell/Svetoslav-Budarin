<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Крестики-Нолики | Классическая игра</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Roboto', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Карточка игры */
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            border-radius: 64px;
            padding: 24px 20px 32px 20px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .game-panel {
            background: #1e2f3c;
            border-radius: 48px;
            padding: 24px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* Заголовок */
        .game-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .game-header h1 {
            margin: 0;
            font-size: 2.1rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #FFD166, #F4A261);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .status-area {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 15px;
            background: #0f1a1f;
            padding: 12px 20px;
            border-radius: 60px;
            margin: 15px 0 10px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5), 0 3px 6px rgba(0,0,0,0.2);
        }

        .turn-indicator {
            background: #2c3e2f;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.3rem;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #ecf0f1;
            box-shadow: inset 0 1px 1px rgba(0,0,0,0.2), 0 2px 4px rgba(0,0,0,0.2);
        }

        .turn-symbol {
            font-size: 1.8rem;
            font-weight: 800;
            background: #00000040;
            padding: 0 12px;
            border-radius: 40px;
            min-width: 65px;
            text-align: center;
            letter-spacing: 2px;
        }

        .turn-text {
            font-size: 1rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .message {
            background: #2d3e42;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            color: #f8f3e2;
            text-align: center;
            flex: 1;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
        }

        /* Игровое поле 3x3 */
        .board {
            display: grid;
            grid-template-columns: repeat(3, minmax(85px, 110px));
            gap: 12px;
            justify-content: center;
            margin: 20px 0 25px;
            background: transparent;
        }

        /* Клетки */
        .cell {
            aspect-ratio: 1 / 1;
            background: #fdf8ed;
            background-image: radial-gradient(circle at 35% 30%, rgba(255,245,215,0.8) 2%, transparent 2.5%);
            background-size: 18px 18px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 800;
            font-family: 'Segoe UI', 'Poppins', system-ui;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 12px 18px -8px rgba(0, 0, 0, 0.4), inset 0 -2px 0 rgba(0,0,0,0.05);
            color: #2c3e50;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.05);
        }

        .cell:hover:not(.disabled) {
            transform: scale(1.02);
            background: #fff6e8;
            box-shadow: 0 16px 22px -10px black;
        }

        /* Стиль для X и O */
        .cell.X {
            color: #e76f51;
            text-shadow: 0 0 5px #f4a26180;
        }

        .cell.O {
            color: #2a9d8f;
            text-shadow: 0 0 5px #2a9d8f80;
        }

        /* Победная подсветка */
        .cell.win-highlight {
            background: #f4d03f;
            color: #1e2f2f;
            box-shadow: 0 0 0 3px #f1c40f, 0 0 0 6px #f39c12;
            transform: scale(1.01);
        }

        /* Неактивная клетка (конец игры) */
        .cell.disabled {
            cursor: default;
            filter: brightness(0.97);
        }

        /* Кнопка сброса */
        .reset-btn {
            background: #f4a261;
            border: none;
            width: 100%;
            padding: 14px 0;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #2d2b26;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s ease;
            box-shadow: 0 6px 0 #b45f2b;
            font-family: inherit;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .reset-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #b45f2b;
        }

        .reset-btn:hover {
            background: #f0b27a;
            letter-spacing: 3px;
        }

        /* адаптив */
        @media (max-width: 480px) {
            .board {
                grid-template-columns: repeat(3, minmax(75px, 90px));
                gap: 10px;
            }
            .cell {
                font-size: 3.2rem;
            }
            .turn-indicator {
                font-size: 1rem;
                padding: 5px 12px;
            }
            .turn-symbol {
                font-size: 1.5rem;
                min-width: 55px;
            }
            .message {
                font-size: 0.85rem;
            }
            .game-panel {
                padding: 18px;
            }
        }
        
        @media (max-width: 380px) {
            .board {
                grid-template-columns: repeat(3, minmax(70px, 80px));
            }
            .cell {
                font-size: 2.8rem;
            }
        }

        footer {
            text-align: center;
            margin-top: 18px;
            font-size: 0.7rem;
            color: #8faaaf;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-panel">
        <div class="game-header">
            <h1>✖️ КРЕСТИКИ-НОЛИКИ 〇</h1>
        </div>

        <div class="status-area">
            <div class="turn-indicator">
                <span class="turn-text">Ход</span>
                <span class="turn-symbol" id="turnSymbol">X</span>
            </div>
            <div class="message" id="statusMessage">
                Игрок X начинает
            </div>
        </div>

        <!-- Игровое поле динамически заполняется через JS -->
        <div class="board" id="board"></div>

        <button class="reset-btn" id="resetGameBtn">
            🔄 Новая игра
        </button>
        <footer>
            ✨ Два игрока | Нажми на клетку чтобы сделать ход
        </footer>
    </div>
</div>

<script>
    (function() {
        // ---------- Игровые переменные ----------
        let boardState = [   // 3x3 матрица, хранит 'X', 'O' или пустую строку ''
            ['', '', ''],
            ['', '', ''],
            ['', '', '']
        ];
        let currentPlayer = 'X';       // X начинает
        let gameActive = true;
        let winCombo = null;            // массив индексов победной линии [ [row,col], ... ]
        
        // DOM элементы
        const boardContainer = document.getElementById('board');
        const turnSymbolSpan = document.getElementById('turnSymbol');
        const statusMessageDiv = document.getElementById('statusMessage');
        const resetBtn = document.getElementById('resetGameBtn');
        
        // все возможные выигрышные комбинации (индексы строк и столбцов)
        const winPatterns = [
            // строки
            [[0,0], [0,1], [0,2]],
            [[1,0], [1,1], [1,2]],
            [[2,0], [2,1], [2,2]],
            // столбцы
            [[0,0], [1,0], [2,0]],
            [[0,1], [1,1], [2,1]],
            [[0,2], [1,2], [2,2]],
            // диагонали
            [[0,0], [1,1], [2,2]],
            [[0,2], [1,1], [2,0]]
        ];
        
        // Вспомогательная функция: обновить UI сообщения и индикатор хода
        function updateUIStatus() {
            if (!gameActive) {
                // если игра завершена (победа или ничья) - индикатор хода не обновляем активным
                if (winCombo) {
                    // уже выведено сообщение о победе, но пусть индикатор показывает победителя статично
                    turnSymbolSpan.innerText = currentPlayer === 'X' ? '🏆 X' : '🏆 O';
                } else {
                    turnSymbolSpan.innerText = '—';
                }
                return;
            }
            turnSymbolSpan.innerText = currentPlayer;
            statusMessageDiv.innerText = `Сейчас ходит игрок ${currentPlayer}`;
        }
        
        // Функция для отрисовки доски на основе boardState
        function renderBoard() {
            // Очищаем контейнер
            boardContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    const cellValue = boardState[i][j];
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (cellValue === 'X') cell.classList.add('X');
                    if (cellValue === 'O') cell.classList.add('O');
                    if (!gameActive) cell.classList.add('disabled'); // если игра окончена, делаем все клетки неактивными визуально
                    cell.textContent = cellValue;
                    
                    // Добавляем подсветку победы, если данная клетка входит в выигрышную комбинацию
                    if (winCombo && winCombo.some(([row, col]) => row === i && col === j)) {
                        cell.classList.add('win-highlight');
                    }
                    
                    // Обработчик клика
                    cell.addEventListener('click', (function(row, col) {
                        return function() { handleCellClick(row, col); };
                    })(i, j));
                    
                    boardContainer.appendChild(cell);
                }
            }
        }
        
        // Проверка на победу
        function checkWin() {
            for (let pattern of winPatterns) {
                const [a, b, c] = pattern;
                const valA = boardState[a[0]][a[1]];
                const valB = boardState[b[0]][b[1]];
                const valC = boardState[c[0]][c[1]];
                
                if (valA !== '' && valA === valB && valB === valC) {
                    // победа! Сохраняем комбинацию для подсветки
                    winCombo = pattern;
                    gameActive = false;
                    statusMessageDiv.innerText = `🎉 Игрок ${valA} победил! 🎉`;
                    turnSymbolSpan.innerText = valA === 'X' ? '⭐ X' : '🌟 O';
                    return true;
                }
            }
            return false;
        }
        
        // Проверка на ничью
        function checkDraw() {
            // если все клетки не пустые и нет победителя
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    if (boardState[i][j] === '') {
                        return false;
                    }
                }
            }
            // ничья
            gameActive = false;
            statusMessageDiv.innerText = "🤝 Ничья! Игра окончена 🤝";
            turnSymbolSpan.innerText = "⚖️";
            return true;
        }
        
        // Переключение игрока
        function switchPlayer() {
            currentPlayer = (currentPlayer === 'X') ? 'O' : 'X';
            if (gameActive) {
                turnSymbolSpan.innerText = currentPlayer;
                statusMessageDiv.innerText = `Сейчас ходит игрок ${currentPlayer}`;
            }
        }
        
        // Обработка клика по клетке
        function handleCellClick(row, col) {
            // Проверяем: активна ли игра, клетка пуста ли?
            if (!gameActive) {
                // Если игра завершена, можно показывать легкое уведомление (не критично)
                statusMessageDiv.innerText = winCombo ? "Игра окончена, нажмите 'Новая игра'" : "Ничья! Начните заново";
                return;
            }
            
            if (boardState[row][col] !== '') {
                // Клетка занята
                statusMessageDiv.innerText = `Клетка занята! Ходит ${currentPlayer}`;
                return;
            }
            
            // Ставим символ
            boardState[row][col] = currentPlayer;
            
            // Перерисовываем доску (обновляем содержимое)
            renderBoard();
            
            // Проверяем победу после хода
            const winnerExists = checkWin();
            if (winnerExists) {
                renderBoard();  // перерисовка с подсветкой победных клеток
                return;
            }
            
            // Проверяем ничью
            const draw = checkDraw();
            if (draw) {
                renderBoard();  // отображаем ничью и блокируем все клетки
                return;
            }
            
            // Игра продолжается - переключаем игрока
            switchPlayer();
            renderBoard();   // перерисовка (чтобы убрать временный disabled? но игра активна, просто отображаем)
        }
        
        // Сброс игры
        function resetGame() {
            // Очищаем состояние
            boardState = [
                ['', '', ''],
                ['', '', ''],
                ['', '', '']
            ];
            currentPlayer = 'X';
            gameActive = true;
            winCombo = null;
            
            // Обновляем интерфейс
            turnSymbolSpan.innerText = 'X';
            statusMessageDiv.innerText = 'Игрок X начинает';
            renderBoard();
        }
        
        // Инициализация игры (создание доски и установка слушателей)
        function initGame() {
            resetGame(); // сразу отрисует доску и всё настроит
            
            // Кнопка сброса - уже есть слушатель
            resetBtn.addEventListener('click', () => {
                resetGame();
            });
        }
        
        // Запускаем игру
        initGame();
    })();
</script>
</body>
</html>
